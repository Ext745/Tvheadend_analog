# /etc/ntsc-tvh.conf  -- configuration for the ntsc-tvh analog TVHeadend helper.
# Simple KEY=VALUE lines; a "# comment" after whitespace is ignored. Any value here
# can also be overridden by an environment variable of the same name. Uncomment and
# edit as needed; defaults shown.
#
# The defaults below are tuned for the common case (Hauppauge HVR-1950 via pvrusb2,
# running in the linuxserver/tvheadend Docker container). They generally Just Work;
# you only need this file to override something.

# ---- device ---------------------------------------------------------------- #
# DEVICE=/dev/video0          # V4L2 capture node of the HVR-1950's analog side
# STANDARD=ntsc               # analog colour standard ("ntsc" -> NTSC-M)

# ---- where state lives ----------------------------------------------------- #
# STATE_FILE=/var/lib/ntsc-tvh/state.json
# M3U_FILE=/var/lib/ntsc-tvh/ntsc.m3u
# LOCK_FILE=/var/lib/ntsc-tvh/ntsc-tvh.lock
#                             # Default lives in the state dir (NOT /run/lock) so the
#                             #   non-root container user (e.g. linuxserver's PUID) can
#                             #   create it. /run/lock is commonly root-only inside the
#                             #   container -> "[Errno 13] Permission denied". Whatever
#                             #   you point this at, that dir must be writable by the
#                             #   user TVHeadend runs as (chown the state dir to PUID:PGID).
# SELF_PATH=/usr/local/bin/ntsc-tvh   # path baked into the pipe:// URLs in the M3U
                                      # leave blank to auto-detect at runtime

# ---- streaming ------------------------------------------------------------- #
# AUDIO_CODEC=copy            # copy | mp2 | ac3.  "copy" keeps the HVR-1950's
                              #   native MP2 audio (zero CPU). Use ac3 only if a
                              #   downstream client really needs it.
# VIDEO_BITRATE=              # blank = use the hardware encoder's default.
                              #   e.g. 6000000 to pin the MPEG-2 bitrate to 6 Mbps.
# CAPTURE_VIA_CAT=1           # 1 = `cat /dev/video0 | ffmpeg`.  DEFAULT ON for HW-MPEG
                              #   cards: on several ffmpeg builds, letting ffmpeg open
                              #   the MPEG node directly (`-f mpeg -i /dev/video0`)
                              #   produces an EMPTY stream, while feeding it through cat
                              #   is reliable. Set 0 only if your build reads the node
                              #   directly without trouble. (Ignored for raw/non-HW cards.)

# ---- raw (software-encode) fallback, only used for non-HVR-1950 cards ------ #
# RAW_VBITRATE=6000000
# RAW_AUDIO_DEV=              # blank = the ALSA card on the same USB/PCI device as
                              #   DEVICE (else none); or set e.g. hw:1,0

# ---- scanning -------------------------------------------------------------- #
# SCAN_TABLES=us-bcast,us-cable   # which plans `scan` walks by default
# SCAN_METHOD=signal          # signal | video | both  (see README for trade-offs)
# SCAN_THRESHOLD=35           # signal-strength %% at/above which a channel counts
# SCAN_VAR_MIN=12             # min luma std-dev for the "video" heuristic
# SCAN_DWELL=1.2              # seconds to let the tuner settle per channel
# SCAN_LOCK_WAIT=5            # seconds a stream/scan waits for the tuner lock before
                              #   giving up (0 = abort instantly if busy). A small wait
                              #   smooths brief contention between a background scan and
                              #   live viewing on the single tuner.

# ---- inputs ---------------------------------------------------------------- #
# INPUTS_ALWAYS_ACTIVE=1      # 1 = composite/svideo always appear as channels
                              #   (handy for game consoles / retro computers that
                              #    you plug in on demand and that won't RF-scan)
